name: Auto-merge autobump PRs

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    # Fork PRs never qualify: the branch must be in this repository.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'autobump/') &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Merge when the PR only changes the Phi cask
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          files="$(gh pr view "$PR_URL" --json files --jq '[.files[].path] | join(",")')"
          if [ "$files" != "Casks/phi.rb" ]; then
            echo "::notice::Not merging: the PR changes '$files', expected only Casks/phi.rb."
            exit 0
          fi
          gh pr merge "$PR_URL" --squash
